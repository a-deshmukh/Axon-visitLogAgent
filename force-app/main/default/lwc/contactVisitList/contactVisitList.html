<template>
    <section class="visit-panel" aria-label="Visits">
        <header class="visit-header">
            <div class="title-wrap">
                <lightning-icon icon-name="standard:event" size="small" alternative-text="Visits"></lightning-icon>
                <div>
                    <h2>Visits</h2>
                    <p>{recordCountLabel}</p>
                </div>
            </div>
            <lightning-combobox
                class="sort-control"
                label="Sort visits"
                variant="label-hidden"
                value={sortValue}
                options={sortOptions}
                onchange={handleSortChange}
            ></lightning-combobox>
        </header>

        <template lwc:if={isInitialLoading}>
            <div class="state-block">
                <lightning-spinner alternative-text="Loading visits" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="state-block error-state" role="alert">{errorMessage}</div>
        </template>

        <template lwc:elseif={hasVisits}>
            <ul class="visit-list">
                <template for:each={visits} for:item="visit">
                    <li key={visit.id} class="visit-item">
                        <c-visit-type-icon type-name={visit.visitTypeName}></c-visit-type-icon>
                        <div class="visit-content">
                            <div class="visit-topline">
                                <div class="visitor-block">
                                    <span class="field-label">Visited by</span>
                                    <a href={visit.recordUrl} class="visitor-link">{visit.visitorDisplayName}</a>
                                </div>
                                <template lwc:if={visit.status}>
                                    <span class="status-pill">{visit.status}</span>
                                </template>
                            </div>
                            <div class="visit-meta">
                                <div class="meta-row">
                                    <lightning-icon icon-name="utility:location" size="xx-small" alternative-text="Facility"></lightning-icon>
                                    <span>{visit.facilityDisplayName}</span>
                                </div>
                                <div class="meta-row">
                                    <lightning-icon icon-name="utility:record" size="xx-small" alternative-text="Visit type"></lightning-icon>
                                    <a href={visit.recordUrl} class="visit-link">{visit.visitTypeName}</a>
                                </div>
                            </div>
                            <template lwc:if={visit.finalSummary}>
                                <div class="discussion-block">
                                    <span class="field-label">Discussion summary</span>
                                    <p class="summary">{visit.finalSummary}</p>
                                </div>
                            </template>
                            <dl class="time-grid">
                                <template lwc:if={visit.actualVisitStartTime}>
                                    <div>
                                        <dt>Start</dt>
                                        <dd>
                                            <lightning-formatted-date-time
                                                value={visit.actualVisitStartTime}
                                                month="short"
                                                day="2-digit"
                                                year="numeric"
                                                hour="2-digit"
                                                minute="2-digit"
                                            ></lightning-formatted-date-time>
                                        </dd>
                                    </div>
                                </template>
                                <template lwc:if={visit.actualVisitEndTime}>
                                    <div>
                                        <dt>End</dt>
                                        <dd>
                                            <lightning-formatted-date-time
                                                value={visit.actualVisitEndTime}
                                                month="short"
                                                day="2-digit"
                                                year="numeric"
                                                hour="2-digit"
                                                minute="2-digit"
                                            ></lightning-formatted-date-time>
                                        </dd>
                                    </div>
                                </template>
                            </dl>
                        </div>
                    </li>
                </template>
            </ul>

            <template lwc:if={hasMore}>
                <div class="load-more-wrap">
                    <lightning-button
                        label={loadMoreLabel}
                        variant="neutral"
                        onclick={handleLoadMore}
                        disabled={isLoadingMore}
                    ></lightning-button>
                </div>
            </template>
        </template>

        <template lwc:else>
            <div class="state-block empty-state">
                <lightning-icon icon-name="utility:date_input" size="small" alternative-text="No visits"></lightning-icon>
                <span>No visits found.</span>
            </div>
        </template>
    </section>
</template>
