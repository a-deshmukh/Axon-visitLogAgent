<template>
    <section class="expense-panel" aria-label="Expenses">
        <header class="expense-header">
            <div class="title-wrap">
                <lightning-icon icon-name="standard:expense" size="small" alternative-text="Expenses"></lightning-icon>
                <div>
                    <h2>Expenses</h2>
                    <p>{recordCountLabel}</p>
                </div>
            </div>
            <lightning-combobox
                class="sort-control"
                label="Sort expenses"
                variant="label-hidden"
                value={sortValue}
                options={sortOptions}
                onchange={handleSortChange}
            ></lightning-combobox>
        </header>

        <template lwc:if={isInitialLoading}>
            <div class="state-block">
                <lightning-spinner alternative-text="Loading expenses" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="state-block error-state" role="alert">{errorMessage}</div>
        </template>

        <template lwc:elseif={hasExpenses}>
            <ul class="expense-list">
                <template for:each={expenses} for:item="expense">
                    <li key={expense.id} class="expense-item">
                        <c-expense-type-icon type-name={expense.expenseType}></c-expense-type-icon>
                        <div class="expense-content">
                            <div class="expense-topline">
                                <div class="expense-heading">
                                    <a href={expense.recordUrl} class="expense-link">{expense.titleDisplay}</a>
                                    <span class="expense-type">{expense.expenseTypeDisplay}</span>
                                </div>
                                <div class="amount-block">
                                    <lightning-formatted-number
                                        value={expense.amount}
                                        format-style="currency"
                                        currency-code={currencyCode}
                                    ></lightning-formatted-number>
                                </div>
                            </div>

                            <dl class="detail-grid">
                                <template lwc:if={expense.transactionDate}>
                                    <div>
                                        <dt>Date</dt>
                                        <dd>
                                            <lightning-formatted-date-time
                                                value={expense.transactionDate}
                                                month="short"
                                                day="2-digit"
                                                year="numeric"
                                            ></lightning-formatted-date-time>
                                        </dd>
                                    </div>
                                </template>
                                <template lwc:if={expense.accountName}>
                                    <div>
                                        <dt>Facility</dt>
                                        <dd>{expense.accountName}</dd>
                                    </div>
                                </template>
                                <template lwc:if={expense.contactName}>
                                    <div>
                                        <dt>Contact</dt>
                                        <dd>{expense.contactName}</dd>
                                    </div>
                                </template>
                                <template lwc:if={expense.visitUrl}>
                                    <div>
                                        <dt>Visit</dt>
                                        <dd><a href={expense.visitUrl}>{expense.visitDisplayName}</a></dd>
                                    </div>
                                </template>
                            </dl>
                        </div>
                    </li>
                </template>
            </ul>

            <template lwc:if={hasMore}>
                <div class="load-more-wrap">
                    <lightning-button
                        label={loadMoreLabel}
                        variant="neutral"
                        onclick={handleLoadMore}
                        disabled={isLoadingMore}
                    ></lightning-button>
                </div>
            </template>
        </template>

        <template lwc:else>
            <div class="state-block empty-state">
                <lightning-icon icon-name="utility:moneybag" size="small" alternative-text="No expenses"></lightning-icon>
                <span>No expenses found.</span>
            </div>
        </template>
    </section>
</template>
